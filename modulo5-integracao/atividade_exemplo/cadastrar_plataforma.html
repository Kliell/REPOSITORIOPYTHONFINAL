<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Games - Cadastrar Plataforma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: 'Roboto', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: #131a2a;
            border: 1px solid #1e293b;
            border-top: 3px solid #00f3ff;
            border-radius: 10px;
            padding: 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            color: #ffffff;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.9rem;
            font-weight: 700;
            color: #00f3ff;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            background-color: #0a0e17;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f8fafc;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 1rem;
            padding: 12px 14px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        input[type="text"]::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus {
            border-color: #00f3ff;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.25);
        }

        button[type="submit"] {
            width: 100%;
            background-color: #00c6ff;
            color: #070b14;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 6px;
            padding: 13px;
            cursor: pointer;
            transition: background-color 0.25s ease, transform 0.15s ease;
        }

        button[type="submit"]:hover {
            background-color: #38bdf8;
            transform: translateY(-1px);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cadastrar Plataforma</h1>
        <form>
            <label for="nome">Nome da Plataforma</label>
            <input type="text" id="nome" name="nome" placeholder="EX: Nintendo Switch 2" required>

            <button type="submit">Cadastrar</button>
        </form>
    </div>
</body>
</html>
